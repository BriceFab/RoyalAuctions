name: Build

# Compile + test on every push/PR to main. Catches breakage (e.g. an unresolved
# dependency or a failing test) long before the Friday release job runs.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/release/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      RA_TEST_MYSQL_PORT: '3306'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B package

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}
          path: target/${{ github.event.repository.name }}.jar
          if-no-files-found: error
