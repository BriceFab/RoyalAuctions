# All messages support & colour codes and the {prefix} placeholder.
prefix: "&6&lAH &8» &r"

general:
  no-permission: "{prefix}&cYou don't have permission to do that."
  player-only: "{prefix}&cOnly players can use this command."
  reloaded: "{prefix}&aConfiguration reloaded."
  invalid-number: "{prefix}&cThat's not a valid number."
  # /ah <player> with a name this server has never seen.
  unknown-player: "&cNo player named &f{player}&c has played here."

# /ah help. A line that is exactly {search-help} is replaced by search.help below.
help:
  - "&6&lAuction House"
  - "&e/ah &7- open the Auction House menu"
  - "&e/ah browse &7- browse all listings"
  - "&e/ah bids &7- auctions you've bid on"
  - "&e/ah <player> &7- view a player's auctions"
  - "&e/ah sell &7- open the Create Auction menu"
  - "{search-help}"
  - "&e/ah listings &7- manage your listings"
  - "&e/ah collect &7- claim purchases & returns"

# /ah category (admins): where the held item would be listed and which rule decided it.
# {category} and {tier} keep their own colour codes.
inspect:
  hold-item: "&cHold the item you want to inspect."
  header: "&6&lItem Category"
  item: "&7Item:     &f{item}"
  category: "&7Category: &f{category} &8({id})"
  matched: "&7Matched:  &f{reason}"
  tier: "&7Tier:     &f{tier}"
  no-tier: "&8none"
  # Shown when the item fell through to the catch-all category.
  unmatched:
    - "&8Nothing matched this item — pin it under a category's"
    - "&8match.items: to place it explicitly."

sell:
  hand-empty: "{prefix}&cYou must be holding an item to sell it."
  usage: "{prefix}&cUsage: &f/ah sell <price>"
  min-price: "{prefix}&cThe minimum listing price is &f{min}&c."
  # Shown when listings.sellable-categories excludes the item's category. Say where it does belong.
  category-not-allowed: "{prefix}&cThe auction house is for gear — weapons, armour, tools,
    accessories and consumables. &7Sell materials and drops on the bazaar with &f/bz&7."
  max-price: "{prefix}&cThe maximum listing price is &f{max}&c."
  too-many: "{prefix}&cYou already have the maximum of &f{max}&c active listings."
  cannot-afford-fee: "{prefix}&cYou need &f{fee}&c to cover the listing fee."
  blacklisted: "{prefix}&cThat item cannot be sold on the Auction House."
  success: "{prefix}&aListed &f{item} &afor &f{price}&a. &7(fee: {fee})"

buy:
  cannot-afford: "{prefix}&cYou can't afford &f{price}&c."
  gone: "{prefix}&cThat listing is no longer available."
  own-listing: "{prefix}&cYou can't buy your own listing."
  inventory-full-collection: "{prefix}&eYour inventory was full — the item was sent to your &f/ah collect&e."
  success: "{prefix}&aPurchased &f{item} &afor &f{price}&a."
  sold-notify: "{prefix}&a{buyer} &abought your &f{item} &afor &f{price}&a."

cancel:
  success: "{prefix}&aListing cancelled — the item is in your &f/ah collect&a."
  not-yours: "{prefix}&cThat isn't your listing."
  gone: "{prefix}&cThat listing is no longer active."
  has-bids: "{prefix}&cYou can't cancel an auction that already has bids."

collection:
  empty: "{prefix}&7Your collection is empty."
  full-inventory: "{prefix}&cYour inventory is full — make room first."
  claimed: "{prefix}&aClaimed &f{item}&a."
  earnings-claimed: "{prefix}&aCollected &f{amount} &afrom the sale of &f{item}&a."
  no-earnings: "{prefix}&7You have no sale earnings to collect."
  # Sent a few seconds after join when items or sale earnings are waiting in the collection, for
  # example an item that was being listed when the player left. Not sent when the "away" summary
  # below already points at /ah collect. Placeholders: {items} (number of items), {earnings} (money).
  waiting: "{prefix}&eYou have unclaimed items or earnings. Claim them with &f/ah collect&e."

expiry:
  expired-notify: "{prefix}&e{count} &7of your listings expired and were returned to &f/ah collect&7."

search:
  # Help line for /ah search in /ah help.
  help: "&e/ah search <query> &7- search by name or enchantment"
  prompt: "{prefix}&eType your search in chat, or type &fcancel&e to go back."
  cancelled: "{prefix}&7Search cancelled."

create:
  price-prompt: "{prefix}&eType the price in chat, or type &fcancel&e to go back."
  price-set: "{prefix}&aPrice set to &f{price}&a."
  need-item: "{prefix}&cPlace an item in the slot first."
  need-price: "{prefix}&cSet a price first."
  cancelled: "{prefix}&7Auction creation cancelled — your item was returned."

bid:
  prompt: "{prefix}&eType your bid amount in chat, or type &fcancel&e to go back."
  own-listing: "{prefix}&cYou can't bid on your own auction."
  too-low: "{prefix}&cYour bid must be at least &f{min}&c."
  cannot-afford: "{prefix}&cYou can't afford a bid of &f{amount}&c."
  placed: "{prefix}&aBid of &f{amount} &aplaced on &f{item}&a."
  # Shown when a bid lands inside the anti-snipe window and pushes the end time back out.
  extended: "{prefix}&eAnti-snipe: the auction now ends in &f{seconds}s&e."

  outbid-already: "{prefix}&cSomeone already bid higher — try again."
  gone: "{prefix}&cThat auction is no longer available."
  you-were-outbid: "{prefix}&eYou were outbid on &f{item}&e. &f{amount} &erefunded."
  new-bid-seller: "{prefix}&a{bidder} &abid &f{amount} &aon your &f{item}&a."

# Saved auction notifications, delivered after settlement/payment for online players,
# or replayed shortly after join. Customize the header for both contexts.
away:
  header: "{prefix}&6Recent auction activity:"
  sold: "{prefix} &a✔ Sold &f{item}&a for &f{amount}&a."
  outbid: "{prefix} &c⇧ Outbid on &f{item}&c — your &f{amount}&c was refunded."
  won: "{prefix} &6★ Won &f{item}&6 for &f{amount}&6 — claim it with &e/ah collect&6."
  expired: "{prefix} &e{count} listing(s) expired &7— &f/ah collect&7."
  more: "{prefix} &8…and {count} more."
  # {item} for an event saved without an item name.
  unknown-item: "an item"

auction:
  won: "{prefix}&aYou won &f{item} &afor &f{amount}&a! Claim it in &f/ah collect&a."
  sold-seller: "{prefix}&aYour auction for &f{item} &asold to &f{buyer} &afor &f{amount}&a."

exchange:
  rejected: "{prefix}&e{reason}"
  unconfirmed: "{prefix}&eThe exchange could not be confirmed. Check your collection or ask staff."
  pending: "{prefix}&eThis exchange is pending recovery. Ask staff to check operation &f{operation}&e."
  declined: "{prefix}&eThe exchange could not be completed. Your previous auction and collection state was retained."
  invalid-listing: "{prefix}&cInvalid listing price or duration."
  purchased: "{prefix}&aPurchase completed. Your item is saved in &f/ah collect&a."
  # Shown when EconGuard refuses a bid or purchase (enforcement.block-flagged-trades on, player flagged).
  # The other side is not told why: a flag is staff business.
  restricted-self: "{prefix}&cYour account can't trade right now. Contact staff if you think this is a mistake."
  restricted-other: "{prefix}&cYou can't trade with {player} right now."
  # Why an exchange was refused, shown through {reason} above.
  reasons:
    already-pending: "An operation is already pending for this item or auction."
    listing-gone: "This listing no longer exists."
    collection-gone: "This collection item is no longer available."
    invalid-amount: "Invalid money amount."
    bid-closed: "This auction is no longer accepting your bid."
    bid-too-low: "The bid must meet the current minimum: {minimum}"
    price-changed: "This purchase is no longer available at that price."
    invalid-duration: "Invalid listing duration."
    item-changed: "The selected item changed."
    listing-limit: "You have reached your listing limit."
    cannot-cancel: "This listing cannot be cancelled."
    # The next ones are only seen by staff (claims of old payments and /ah recovery).
    payment-listing-gone: "The payment's listing no longer exists."
    unknown-operation: "Unknown operation."
    not-interrupted: "Only interrupted APPLYING operations older than two minutes can be reconciled."
    origin-active: "The originating server is still active. Stop that process before reconciliation."

payment-pending: "{prefix}&eAn auction payment is on hold. Staff can check its status; do not repeat the transaction."

# /ah recovery (staff). resolve only runs from the console.
recovery:
  usage: "Usage: /ah recovery [page] or /ah recovery resolve <id> <applied|not-applied> confirm"
  resolve-usage: "Console: /ah recovery resolve <operation-id> <applied|not-applied> confirm"
  invalid-id: "Invalid operation ID."
  reconciled: "Reconciled {operation}"
  # {reason} is one of exchange.reasons, or a database error.
  refused: "Recovery refused: {reason}"
  header: "Pending auction operations, page {page} (up to 50): {count}"
  entry: "{id} {kind} {state} player={player} amount={amount} listing={listing} collection={collection} origin={origin} updated={updated}"

# Buttons of the text input dialog (search, price, custom bid). Escape works like Cancel.
input:
  confirm: "&aDone"
  cancel: "&cCancel"

# Text inside the menus: item names, lore lines and filter labels. Colour codes work; {placeholders}
# are filled in by the plugin.
gui:
  none: "None"
  all: "All"
  not-set: "Not set"
  no-filter: "No Filter"
  no-tiers: "&8No tiers configured"
  filter:
    all: "Show All"
    bin: "Buy It Now only"
    auction: "Auctions only"
  sort:
    newest: "Newest"
    oldest: "Oldest"
    price-low: "Price ↑"
    price-high: "Price ↓"
    ending-soon: "Ending Soon"
  type:
    auction: "&dAuction"
    bin: "&bBuy It Now"
    auction-plain: "Auction"
    bin-plain: "Buy It Now"
    auction-desc: "&7Players bid; highest wins at the end"
    bin-desc: "&7Sold instantly at a fixed price"
  type-line: "&7Type: {type}"
  type-toggle: "&7Click to switch to {type}"
  label:
    current-bid: "Current bid"
    starting-bid: "Starting bid"
  seller: "&7Seller: &f{seller}"
  price: "&7Price: &a{price}"
  current-bid: "&7Current bid: &a{price}"
  starting-bid: "&7Starting bid: &a{price}"
  your-bid: "&7Your bid: &e{price}"
  bid-price-line: "&6{label}: &e{price} coins"
  bin-price-line: "&6Buy it now: &e{price} coins"
  top-bidder: "&7Top bidder: &f{bidder}"
  leader: "&7Leader: &f{bidder}"
  # {bidder} in leader while an auction has no bids.
  no-leader: "-"
  bids: "&7Bids: &f{bids}"
  no-bids: "&7No bids yet"
  ends-in: "&7Ends in: &f{time}"
  duration: "&7Duration: &f{hours}h"
  listing-fee: "&7Listing fee: &c{fee}"
  top-bidder-badge: "&a&lTOP BIDDER"
  outbid-badge: "&c&lOUTBID"
  winning: "&7You're winning this one."
  click-bid-again: "&eClick to bid again"
  click-bid: "&eClick to bid"
  click-buy: "&eClick to buy"
  click-bid-browse: "&eClick to bid!"
  click-purchase: "&eClick to purchase!"
  own-listing: "&7This is your own listing."
  own-listing-browse: "&cThis is your own listing"
  click-view: "&7Click to view"
  currently-viewing: "&aCurrently viewing"
  click-select: "&7Click to select"
  currently-selected: "&aCurrently selected"
  right-click-cancel: "&cRight-click to cancel"
  cannot-cancel: "&cCan't cancel — this auction has bids"
  cancel-returns: "&7The item is returned to your Collection."
  click-remove-item: "&7Click to remove and return it to your inventory"
  collection-reason: "&7Reason: &f{reason}"
  click-claim: "&eClick to claim"
  reason:
    purchase: "Purchase"
    expired: "Expired listing"
    cancelled: "Cancelled listing"
  # Time left on a listing, and a listing duration that matches none of listings.durations.
  time:
    expired: "expired"
    days: "{days}d {hours}h"
    hours: "{hours}h {minutes}m"
    minutes: "{minutes}m {seconds}s"
    seconds: "{seconds}s"
    duration: "{hours}h"
  # How labels are styled in the menus' option lists. {label} is the label from above (or the
  # tier or duration name). An unselected label has its own colour codes removed first.
  format:
    selected: "&e> {label}"
    unselected: "&8  {label}"
    filter: "&f{label}"
    no-tier: "&7{label}"
    duration-selected: "&a{label}"
    duration: "&e{label}"
  # Text input dialog: the first line of each pair is the title, the second sits under it.
  # (The key is still "sign" so existing translations keep working.)
  sign:
    search-1: "Search by name or enchantment"
    search-2: "e.g. sharpness V, blank = show all"
    price-1: "Enter a price"
    price-2: "in numbers"
    bid-1: "Enter your bid"
    bid-2: "amount"
