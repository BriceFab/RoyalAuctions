# Confirm Bid. Shown before a bid is placed (disable with confirmations.bid: false in config.yml).
# Placeholders: %bid% %current_bid% %seller% %balance%
# %balance% is the Vault balance on money listings; other currencies show gui.balance-unknown.

title: "&8Confirm Bid"
rows: 3

# Sounds this menu plays. enabled: false silences one without deleting it.
sounds:
  open:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

mask:
  items:
    - black_stained_glass_pane
  pattern:
    - "111111111"
    - "111111111"
    - "111111111"

slots:
  - id: item
    item: paper name:"&fItem"
    lore: []
    row: 2
    column: 5
    left-click: []

  - id: confirm
    item: lime_stained_glass_pane name:"&aConfirm Bid"
    lore:
      - "&7Bid &e%bid%"
      - ""
      - "&7Your balance: &f%balance%"
      - ""
      - "&8Your money is held until you are"
      - "&8outbid or the auction ends."
    row: 2
    column: 3
    left-click:
      - id: ah_confirm_bid

  - id: cancel
    item: red_stained_glass_pane name:"&cBack"
    lore:
      - "&7Return without bidding."
    row: 2
    column: 7
    left-click:
      - id: ah_back
