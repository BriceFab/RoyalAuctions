# RoyalAuctions configuration

# Storage type: SQLITE (single server, no setup) or MYSQL (network / shared).
storage:
  type: SQLITE
  # Only used when type: MYSQL
  mysql:
    host: localhost
    port: 3306
    database: royalauctions
    username: root
    password: ""
    # Extra JDBC params appended to the connection URL.
    properties: "useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true"
    pool-size: 10
  # SQLite file name (stored in the plugin folder). Only used when type: SQLITE.
  sqlite-file: auctions.db

# Listing rules. Listings are created in the GUI: /ah, then "Create Auction".
listings:
  # Selectable listing durations shown on the "Auction Duration" screen.
  durations:
    - label: "1 Hour"
      hours: 1
      icon: RED_TERRACOTTA
    - label: "6 Hours"
      hours: 6
      icon: ORANGE_TERRACOTTA
    - label: "12 Hours"
      hours: 12
      icon: YELLOW_TERRACOTTA
    - label: "1 Day"
      hours: 24
      icon: LIME_TERRACOTTA
    - label: "2 Days"
      hours: 48
      icon: PINK_TERRACOTTA
  # Duration a new listing defaults to (must match one of the hours values above).
  default-duration-hours: 24
  # Default type a new listing opens as: BIN (buy-it-now) or AUCTION (bidding).
  default-type: BIN
  # Maximum active listings a player may have at once (-1 = unlimited).
  # The permission royalauctions.limit.<n> overrides this (the highest one a
  # player has wins), and royalauctions.limit.unlimited removes the cap.
  max-per-player: 7
  # Lowest listing price, in Vault currency.
  min-price: 1.0

  # Categories that may be listed (category ids, see categories/). Empty = anything
  # can be sold. Anything left out is refused with the category-not-allowed message,
  # which should say where the item does belong.
  sellable-categories: []
  # Highest listing price; -1 disables the upper bound.
  max-price: -1
  # Listing fee charged to the seller when posting. Non-refundable.
  #   percent: fraction of the sale price (0.02 = 2%)
  #   minimum: floor for the fee regardless of percent
  fee:
    percent: 0.02
    minimum: 5.0
  # true: purchases go straight into the buyer's inventory when there is room,
  # overflowing to the collection. false: all purchases go to the collection.
  instant-deliver-purchases: true

  # true: sale money waits in the Collection menu (Earnings button) until the
  # seller collects it, instead of being paid at once. Bid refunds are still paid
  # at once. Turning this off pays out what is waiting.
  manual-earnings-collection: false

# Bidding (AUCTION listings). Outbid players are refunded automatically.
bidding:
  # Each new bid must beat the current bid by at least the larger of a flat
  # amount and a percentage of the current bid.
  min-increment: 10.0
  increment-percent: 0.05

  # A bid in the final N seconds pushes the end time back out to N seconds away,
  # so a last-second bid can always be answered. 0 disables it.
  anti-snipe-seconds: 60

# Menus are configured per file in gui/ (title, size, filler, sounds, and each
# button's slot, item, lore and click action). Run /ah reload after editing.

# How categories resolve, for every item:
#   1. match.items: an exact pin ("ecoitems:brazen_sword", "minecraft:trident").
#      Wins over every other rule, in any category, at any priority.
#   2. match.eco-namespaces: a whole eco plugin (talismans, ecoarmor, ...).
#   3. match.materials / material-suffixes / material-prefixes / tags: the item's
#      base material, only a guess for custom items.
#   4. match.any: true, the catch-all.
# /ah category (holding an item) shows where it lands and which rule decided it.
# On startup, eco items that only hit the catch-all are logged so you can pin them.
category-options:
  # true  = only items pinned via match.items get a category; everything else
  #         falls to the catch-all.
  # false = pins first, then the rules above (recommended).
  strict-items: false

# Browse categories live in categories/<name>.yml; the file name is the category id.
# Categories are tried in ascending `priority` order and the first match wins.
# Exactly one category must be the catch-all (match.any: true, highest priority
# number); by default that's tools_misc.yml.
# Match rule types (a category matches if any of its rules do):
#   eco-namespaces   : eco plugin namespaces, e.g. [talismans], [ecoitems]
#   materials        : exact Bukkit material names
#   material-suffixes: material name ends with any of these (e.g. _SWORD)
#   material-prefixes: material name starts with any of these
#   tags             : EDIBLE, BLOCK, ARMOR, TOOL, WEAPON
#   any              : true = catch-all
# An old inline `categories:` block in this file is migrated to categories/ on start.

# Confirmation screens. Turn any off for fewer clicks.
# Layouts: gui/confirm-purchase.yml, confirm-bid.yml, confirm-cancel.yml
confirmations:
  bid: true
  cancel: true
  purchase: true

# Tier filter on the browse screen. Tiers are eco's rarities, discovered from
# plugins/EcoItems/rarities/*.yml; define them there. This section only sets
# cycle order, icons and what to hide. The filter starts at "No Filter".
tiers:
  enabled: true

  # Cycle order. Discovered rarities not listed here follow, sorted by weight.
  # 'none' ("no rarity") is always excluded.
  order:
    - common
    - uncommon
    - rare
    - epic
    - legendary
    - mythic
    - special
    - very_special

  # Rarities to leave out of the filter entirely.
  hide: []

  # Optional icon per tier, shown on the tier filter button.
  icons:
    common: WHITE_DYE
    uncommon: LIME_DYE
    rare: BLUE_DYE
    epic: PURPLE_DYE
    legendary: ORANGE_DYE
    mythic: RED_DYE
    special: PINK_DYE
    very_special: MAGENTA_DYE


# Browse sort: NEWEST, OLDEST, PRICE_LOW, PRICE_HIGH, ENDING_SOON
default-sort: NEWEST

# How often (in minutes) the plugin sweeps for expired listings.
expiry-sweep-minutes: 5

# Days closed listings (sold / expired / cancelled) and their bid history are
# kept as an audit trail. 0 = keep forever.
closed-retention-days: 90

