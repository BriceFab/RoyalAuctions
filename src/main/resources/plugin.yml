name: RoyalAuctions
version: ${version}
main: com.mystipixel.royalauctions.RoyalAuctionsPlugin
api-version: '26.2'
author: Mystipixel
description: Hypixel-style Auction House with full eco-suite item compatibility.
depend:
  - Vault
softdepend:
  - eco
  - EcoItems
  - EcoArmor
  - Talismans
  - Reforges
  - PlaceholderAPI
  - EconGuard
# JDBC + connection pool are downloaded at runtime by Paper's library loader.
# Keep these versions identical to the matching dependencies in pom.xml.
libraries:
  - org.xerial:sqlite-jdbc:3.53.4.0
  - com.zaxxer:HikariCP:7.1.0
  - com.mysql:mysql-connector-j:26.7.0
commands:
  auctionhouse:
    description: Open and manage the Auction House.
    usage: /ah [sell|search <query>|collect|listings|reload|recovery]
    aliases: [ah, auctions, auction]
permissions:
  royalauctions.use:
    description: Open and browse the Auction House.
    default: true
  royalauctions.sell:
    description: List items for sale.
    default: true
  royalauctions.admin:
    description: Reload config, inspect categories, and review recovery operations.
    default: op
